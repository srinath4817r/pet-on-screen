<script>
window.MODE=new URLSearchParams(location.search).get('mode')==='desktop'?'desktop':new URLSearchParams(location.search).get('mode')==='overlay'?'overlay':'capsule';
const V=THREE, PI=Math.PI, TAU=PI*2, S=Math.sin, cl=(x,a,b)=>Math.max(a,Math.min(b,x));
const cv=document.getElementById('c');

const R=new V.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.outputEncoding = V.sRGBEncoding;
R.toneMapping = V.ACESFilmicToneMapping;
R.toneMappingExposure = 1.1;
R.shadowMap.enabled = true;
R.localClippingEnabled = true;
R.shadowMap.type = V.PCFSoftShadowMap;

const scene=new V.Scene(), cam=new V.PerspectiveCamera(38, 1, 0.1, 100);

/* Environment reflections */
(function(){
  const c=document.createElement('canvas'); c.width=512; c.height=256; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#9a8fd0'); gr.addColorStop(.5,'#4a3f6a'); gr.addColorStop(1,'#2a1f3a');
  g.fillStyle=gr; g.fillRect(0,0,512,256);
  g.fillStyle='#fff'; g.fillRect(60,40,130,55); g.fillRect(300,20,100,40); 
  g.fillStyle='#ffb0c8'; g.fillRect(420,80,60,70); g.fillStyle='#bfe0ff'; g.fillRect(200,100,50,30);
  const t=new V.CanvasTexture(c); t.mapping=V.EquirectangularReflectionMapping; t.encoding=V.sRGBEncoding;
  scene.environment=new V.PMREMGenerator(R).fromEquirectangular(t).texture;
})();

scene.add(new V.HemisphereLight(0xffffff, 0x2a1a48, 0.6));
const dl=new V.DirectionalLight(0xfff0e6, 1.5);
dl.position.set(4, 8, 5); dl.castShadow = true;
dl.shadow.mapSize.width = 1024; dl.shadow.mapSize.height = 1024; dl.shadow.bias = -0.001;
scene.add(dl);
const rim=new V.PointLight(0x00ccff, 3, 20); rim.position.set(-4, 3, -5); scene.add(rim);

/* Pedestal */
const pedMat = new V.MeshStandardMaterial({color:0x1a1525, roughness:0.2, metalness:0.8});
const ped=new V.Mesh(new V.CylinderGeometry(4.8, 5.0, 0.4, 64), pedMat);
ped.position.y=-0.2; ped.receiveShadow = true; scene.add(ped);
[[4.2, 0xff2a6a], [3.7, 0x3ea8ff]].forEach(a=>{
  const r=new V.Mesh(new V.TorusGeometry(a[0], 0.02, 16, 128), new V.MeshBasicMaterial({color:a[1]}));
  r.rotation.x=PI/2; r.position.y=0.02; scene.add(r);
});
const sg=document.createElement('canvas'); sg.width=sg.height=128;
{const g=sg.getContext('2d'), r=g.createRadialGradient(64,64,10,64,64,64);
r.addColorStop(0,'rgba(0,0,0,0.8)'); r.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=r; g.fillRect(0,0,128,128);}
const shadow=new V.Mesh(new V.PlaneGeometry(3.8, 3.8), new V.MeshBasicMaterial({map:new V.CanvasTexture(sg), transparent:true, depthWrite:false, opacity:0.8}));
shadow.rotation.x=-PI/2; shadow.position.y=0.03; scene.add(shadow);

/* ---------- PORING BODY ---------- */
const ctrl=[[0,0],[.9,.04],[1.3,.2],[1.42,.55],[1.3,.95],[1.0,1.3],[.7,1.6],[.42,1.85],[.22,2.05],[.05,2.2]].map(a=>new V.Vector2(a[0],a[1]));
const prof=new V.SplineCurve(ctrl).getPoints(70).map(p=>new V.Vector2(Math.max(p.x,0),p.y));
const geo=new V.LatheGeometry(prof, 128); 
const pa=geo.attributes.position;
for(let i=0; i<pa.count; i++){
  const y=pa.getY(i);
  if(y>1.1) pa.setX(i, pa.getX(i) - 0.8 * Math.pow((y-1.1)/1.1, 2.2));
}
geo.computeVertexNormals();
function rad(y){for(let i=1;i<prof.length;i++)if(prof[i].y>=y){const a=prof[i-1],b=prof[i];return a.x+(b.x-a.x)*(y-a.y)/Math.max(b.y-a.y,1e-4)}return 0}

const bodyMat=new V.MeshPhysicalMaterial({color: 0xff5c80, roughness: 0.05, transmission: 0.85, ior: 1.35, clearcoat: 1.0, transparent: true, opacity: 1.0});

const body=new V.Mesh(geo, bodyMat); body.renderOrder=1; body.castShadow = true;

function place(o,x,y,off,par){
  const rr=rad(y), z=Math.sqrt(Math.max(rr*rr-x*x, .01)), d=(rad(y+.02)-rad(y-.02))/.04;
  const nr=1/Math.sqrt(1+d*d), ny=-d*nr, h=Math.hypot(x,z);
  const n=new V.Vector3(x/h*nr, ny, z/h*nr);
  o.position.set(x,y,z).addScaledVector(n,off);
  o.lookAt(o.position.clone().add(n)); (par||faceG).add(o);
}

const _r=new V.Color(0xff3030), _re=new V.Color(0x660000), _y=new V.Color(0x8dffb8), _ye=new V.Color(0x10c050);
function updateColor(a,c){
  const v = useCustomCol ? customVar : VAR[cId];
  bodyMat.color.setHex(v[1]); bodyMat.emissive.setHex(v[2]); coreMat.color.setHex(v[3]);
  if(a>.01){bodyMat.color.lerp(_r,a); bodyMat.emissive.lerp(_re,a); coreMat.color.lerp(_r,a);}
  if(c>.01){bodyMat.color.lerp(_y,c*.8); bodyMat.emissive.lerp(_ye,c*.6); coreMat.color.lerp(_y,c);}
  mouthMat.color.setHex(!useCustomCol && cId===0 ? 0xd8407f : 0x4a0a1e);
  browMat.color.setHex(!useCustomCol && cId===0 ? 0x8a2a5c : 0x3a0a18);
}

function setVar(i){
  useCustomCol = false;
  cId = i; const v=VAR[i]; 
  coreMat.emissive.setHex(v[2]); chuteMat.color.setHex(v[1]); 
  updateColor(0, 0);
}

}

    customVar = ['Custom', c.getHex(), emCol.getHex(), coreCol.getHex(), emCol.getHex()];

  customInput.addEventListener('input', e => applyCustom(e.target.value));

/* ---------- STATE / LOOP ---------- */
let cur='Idle', ct=0, px=0, pz=0, lean=0, idleLim=3, bt=2, bl=0; 
const sm0=D();
const acc={};
const btns=document.getElementById('btns'), autoC=document.getElementById('auto');

const allClips = ['Idle','LookAround','Walk','Run','Dash','Jump','Fall','Land','Roll','Spin','Hover','Happy','Curious','Blink','Sleep','WakeUp','Shy','Peek','Hide','Attention','Surprised','Celebration','Eat','CallReaction','TouchReaction','Coding','Music','Charge','Angry','Cry'];
allClips.forEach(n=>{
  const b=document.createElement('button'); b.textContent=n; b.dataset.n=n;
  b.onclick=()=>start(n,1); btns.appendChild(b);
});

function pickTx(){let t; do t=-2.3+Math.random()*4.6; while(Math.abs(t-px)<1.2); return t;}
function start(n,usr){
  cur=n; ct=0; const c=clips[n];
  if(c && c.sp){tx=pickTx(); dir=tx>px?1:-1;}
  idleLim=3+Math.random()*3;
  [...btns.children].forEach(b=>b.classList.toggle('on',b.dataset.n===n));
}

function update(dt){
  ct+=dt; const c=clips[cur], u=c.loop?0:Math.min(ct/(c.d||1),1), o=D(); 
  if(c) c.f(u,o,ct);
  
  bt-=dt; if(bt<0){bt=2.5+Math.random()*3; bl=.18;}
  if(bl>0){bl-=dt; o.blink=Math.max(o.blink, S(Math.max(bl,0)/.18*PI));}
  
  let done=false;
  if(c && c.sp){px=cl(px+dir*c.sp*dt,-2.6,3.3); if(ct>=c.d&&!c.loop&&!c.to)done=true; if(c.to&&(dir*(tx-px)<=.02||ct>8))done=true;}
  else if(c && !c.loop&&ct>=c.d) done=true;
  if(done) start(chain[cur]||'Idle');
  
  if(autoC.checked && !isDragging && cur !== 'ParachuteDrop'){
    if(cur==='Idle'&&ct>idleLim) start(pool[Math.random()*pool.length|0]);
  }
  if(!isDragging && cur !== 'ParachuteDrop'){
    manualY += (0 - manualY) * (1 - Math.exp(-dt*15));
  }

  /* smoothing */
  const k=1-Math.exp(-dt*28);
  ['ox','oy','rx','sq','sx','eye','blink','look','lookY','blush','anger','sad','eyeRot','chg'].forEach(a=>sm0[a]+=(o[a]-sm0[a])*k);
  lean+=((c&&c.sp?dir*(c.sp>3?.45:.35):0)-lean)*(1-Math.exp(-dt*8));
  pz+=((px>2?-.4:0)-pz)*(1-Math.exp(-dt*6));
  
  const s=sm0, sx=(1-s.sq*.5)*s.sx;
  sc.scale.set(sx, 1+s.sq, (1-s.sq*.5)/Math.sqrt(s.sx));
  root.position.set(px+s.ox, manualY + s.oy, pz);
  rot.rotation.order='YXZ'; rot.rotation.set(s.rx, o.ry+lean, o.rz);
  faceG.rotation.set(-s.lookY*.25, s.look*.45, 0);
  
  // EXPRESSIVE EYES
  eyes.forEach((e,i)=>{
    const cb=Math.max(.06, 1-s.blink); e.scale.set(s.eye, s.eye*cb, s.eye); 
    e.userData.hl.forEach(h=>h.visible=s.blink<.6);
    e.userData.inner.rotation.z = s.eyeRot * (i===0 ? -1 : 1);
  });
  
  let m=Math.round(o.mouth), mS=1.25, mY=1;
  if(cur==='Sleep'){m=2; mS=.6+.12*S(ct*1.6);}
  else if(cur==='Charge'){m=4; mS=1.1; mY=0.92 + 0.08*S(ct*2.2);}
  else if(cur==='Cry') mY=1+.2*S(ct*12);
  else if(cur==='WakeUp'){m=7; mS=1.1;}
  else if(cur==='Fall') m=6;
  mouths.forEach((g,i)=>g.visible=(i+1===m));
  mouthG.scale.set(mS,mS*mY,mS);
  brows.forEach(w=>{const k=Math.max(s.anger,s.sad); w.visible=k>.05; w.userData.b.rotation.z=w.userData.sd*(s.anger*.5-s.sad*.45);});
  
  cheekMat.opacity=0.7+s.blush*0.3; cheeks.forEach(ch=>ch.scale.setScalar(1+s.blush*0.3));
  updateColor(s.anger,s.chg);
  
  shadow.position.x=px; shadow.position.z=pz; 
  shadow.scale.setScalar(0.9*(1-Math.min(s.oy + manualY,2)*0.18)+0.1); 
  shadow.material.opacity=0.8 - Math.min(s.oy + manualY,3)*0.25;
  
  laptop.visible = (cur === 'Coding'); if(laptop.visible){ laptop.position.set(px, 0.05, 1.4+pz); }
  chuteG.visible = (cur === 'ParachuteDrop');
  Object.entries(accs).forEach(([k,a])=> { a.visible = (k===accSel || k===hatSel || (k==='phones' && cur==='Music')); });
  
  // PEACEFUL CHARGING & 3-SECOND LIQUID FILL
  const ch=(cur==='Charge'); aura.visible=ch; chgRing.visible=ch;
  if(ch){
    aura.position.set(px+s.ox, manualY+s.oy+1.0, pz-.9); 
    aura.scale.setScalar(5.0*(1+.08*S(ct*2.5))); 
    aura.material.opacity=.55+.15*S(ct*2.5);
    const q=(ct*0.8)%1; 
    chgRing.position.set(px,.05,pz); 
    chgRing.scale.setScalar(.8+q*3.0); 
    chgRing.material.opacity=(1-q)*0.7;
  }
  fluid.visible=ch; levelEl.style.display=ch?'block':'none';
  if(ch){
    const fillDuration = 3.0;
    const holdDuration = 1.0;
    const totalCycle = fillDuration + holdDuration;
    const p = (ct % totalCycle);
    const f = Math.min(p / fillDuration, 1.0);
    const full = (p >= fillDuration);
    
    const H=2.2*.9*(1+s.sq), y0=sc.getWorldPosition(new V.Vector3()).y;
    const tilt = (full ? 0.015 : 0.04) * S(ct * 2.8);
    fluidPlane.normal.set(tilt, -1, tilt*.5).normalize();
    fluidPlane.constant = y0 + f * H * 1.02 + (full ? 1 : 0);
    fluidMat.emissiveIntensity = full ? 1.05 + 0.15*S(ct*3) : 0.75 + 0.25*f;
    levelEl.textContent = full ? '100% CHARGED' : 'CHARGING '+Math.round(f*100)+'%';
  }
  
  snotBubble.visible = (cur === 'Sleep');
  if(snotBubble.visible) {
    const cycle = (ct % 3) / 3;

  if(ct1&&lastId===a.id){clearTimeout(ct1);ct1=0;openApp(a);return}      /* double tap = open */
  clearTimeout(ct1);lastId=a.id;ct1=setTimeout(()=>{ct1=0;showInfo(a)},260)};   /* single tap = info */
const head=(a,note)=>`<div class="ih"><b>${esc(a.n)}</b><small>${esc(note||'')}</small><span></span><button data-x="cfg" title="Manage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 5.5v-3l-2.3-.6a7 7 0 0 0-.7-1.6l1.2-2-2.1-2.1-2 1.2a7 7 0 0 0-1.6-.7L13 2h-3l-.6 2.7a7 7 0 0 0-1.6.7l-2-1.2-2.1 2.1 1.2 2a7 7 0 0 0-.7 1.6L2 10v3l2.2.6a7 7 0 0 0 .7 1.7l-1.2 2 2.1 2.1 2-1.2a7 7 0 0 0 1.7.7L10 21h3l.6-2.2a7 7 0 0 0 1.7-.7l2 1.2 2.1-2.1-1.2-2a7 7 0 0 0 .7-1.7z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button><button data-x="open" title="Open"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 13v6H5V6h6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button><button data-x="close" title="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div>`;
const bare=t=>`<div class="ih"><b>${esc(t)}</b><span></span><button data-x="close">✕</button></div>`;
const rows=(L,empty)=>L.length?L.map(i=>`<div class="it"${i.u?` data-u="${esc(i.u)}"`:''}><i>${esc((i.t||'?')[0])}</i><div><b>${esc(i.t)}</b><small>${esc(i.s)}</small></div><em>${esc(i.w)}</em></div>`).join(''):'<div class="empty">'+esc(empty)+'</div>';
async function showInfo(a){sel=a.id;BADGE[a.id]=0;renderStrip();isl.dataset.info='on';
  if(await needs(a))return ask(a);
  info.innerHTML=head(a,'Loading…')+'<div class="il"></div>';
  let d={items:[]},note='Shortcut',empty='Tap ↗ or double-tap the icon to open it.';
  try{if(HOOKS[a.h]){d=await HOOKS[a.h](a);note=d.note||'Live';empty='Nothing new right now.'}}
  catch(err){if(err.message==='NATIVE'){note='Windows notifications unavailable';empty='Notification access is not connected on Windows. On Android, allow Poring Pet notification access, then WhatsApp notifications appear here.'}else{note='Can’t load';empty='Couldn’t load: '+(err.message||'blocked')}}
  if(sel!==a.id)return;
  info.innerHTML=head(a,note)+'<div class="il">'+rows(d.items||[],empty)+'</div>'}
function ask(a){const n=NEED[a.h];
  info.innerHTML=bare(a.n)+`<div class="fm one"><input id="f1" type="password" placeholder="${esc(n.ph)}"><button id="fs">Connect</button><small>${esc(n.tip)}</small></div>`;
  const go=async()=>{const v=$('#f1').value.trim();if(!v)return;if(NAT().validateCredential){let check;try{check=JSON.parse(NAT().validateCredential(a.h,v))}catch(_){check={ok:false,message:'Could not validate the credential.'}}if(!check.ok){info.innerHTML=bare('Connection failed')+'<div class="mobile-note">'+esc(check.message||'Credential was not accepted.')+'</div><button class="mobile-action" id="credential-retry">Try again</button>';$('#credential-retry').onclick=()=>ask(a);return}}if(NAT().setCredential){const saved=await NAT().setCredential(a.h,v);if(!saved){info.innerHTML=bare('Connection failed')+'<div class="mobile-note">Could not store the credential securely.</div>';return}}else{a[n.k]=v;save()}showInfo(a)};
  $('#fs').onclick=ev=>{ev.stopPropagation();go()};$('#f1').onkeydown=ev=>{if(ev.key==='Enter')go()}}
function manage(a){const n=NEED[a.h];
  info.innerHTML=bare(a.n)+`<div class="fm one">${n&&(a[n.k]||NAT().setCredential)?'<button id="b1">Disconnect</button>':''}<button id="b2">Remove shortcut</button><button id="b3">Back</button></div>`;
  const b1=$('#b1');if(b1)b1.onclick=async ev=>{ev.stopPropagation();if(NAT().deleteCredential)await NAT().deleteCredential(a.h);delete a[n.k];save();showInfo(a)};
  $('#b2').onclick=ev=>{ev.stopPropagation();apps=apps.filter(z=>z.id!==a.id);save();closeInfo()};$('#b3').onclick=ev=>{ev.stopPropagation();showInfo(a)}}
function addApp(){isl.dataset.info='on';sel='';renderStrip();
  info.innerHTML=bare('New shortcut')+`<div class="fm"><input id="f1" placeholder="Name"><input id="f2" placeholder="https://… or app path"><select id="f3"><option value="none">Just open it</option><option value="github">GitHub info</option><option value="vercel">Vercel info</option><option value="native">Notifications (desktop app)</option></select><div class="fb">${NAT().pickApp?'<button id="fp">Browse app…</button>':''}<button id="fs">Add</button></div></div>`;
  const fp=$('#fp');if(fp)fp.onclick=async ev=>{ev.stopPropagation();try{const p=await NAT().pickApp();if(p){$('#f2').value=p;if(!$('#f1').value)$('#f1').value=p.split(/[\\/]/).pop().replace(/\.[^.]+$/,'')}}catch(_){}};
  $('#fs').onclick=ev=>{ev.stopPropagation();const u=$('#f2').value.trim()||'https://';apps.push({id:'x'+Date.now(),n:$('#f1').value.trim()||'App',u,h:$('#f3').value,kind:/^(?:[a-z]:[\\/]|\\\\|file:)/i.test(u)?'app':'link',c:PAL[apps.length%PAL.length]});save();closeInfo()}}
function closeInfo(){isl.dataset.info='off';sel='';info.innerHTML='';renderStrip()}
info.onclick=e=>{e.stopPropagation();const x=e.target.closest('[data-x]'),it=e.target.closest('[data-u]'),a=apps.find(z=>z.id===sel);
  if(x){const k=x.dataset.x;if(k==='close')closeInfo();else if(k==='open'&&a)openApp(a);else if(k==='cfg'&&a)manage(a)}
  else if(it)openUrl(it.dataset.u)};
try{NAT().onNotification&&NAT().onNotification(n=>{const a=apps.find(x=>x.id===(n&&n.app));if(!a)return;BADGE[a.id]=(BADGE[a.id]||0)+1;renderStrip();if(sel===a.id)showInfo(a);if(st.inside&&!st.busy)start('CallReaction',1)})}catch(_){}
renderStrip();

/* ---- Wi-Fi / Bluetooth (real values come from the desktop app) ---- */
const NET={wifi:{on:false,connected:false,ssid:'',signal:null,available:[]},bluetooth:{on:false,known:false,connected:[],available:[]}};
function renderNet(){const w=NET.wifi,b=NET.bluetooth;$('#nw').classList.toggle('on',!!w.connected);$('#nb').classList.toggle('on',!!(b.connected||[]).length);
  $('#nws').textContent=w.connected?(w.ssid+' · '+(w.signal==null?'signal unavailable':w.signal+'%')):w.on?'On · not connected':'Off';
  const connected=(b.connected||[])[0];$('#nbs').textContent=!b.known?'Permission needed':connected?'Connected · '+connected:b.on?'No connected device':'Off'}
async function pollNet(){if(!NAT().getNetwork){NET.wifi.on=navigator.onLine;renderNet();return}
  try{const n=await NAT().getNetwork();if(n){Object.assign(NET.wifi,n.wifi||{});if(n.bluetooth)Object.assign(NET.bluetooth,n.bluetooth);else if(n.bt)Object.assign(NET.bluetooth,n.bt)}}catch(_){}renderNet();renderOverlayMediaBubble()}

function pollOverlayBubbleData(){if(MODE!=='overlay')return;try{const bytes=NAT().getTrafficBytes?.();if(bytes&&bytes.rx>=0&&bytes.tx>=0){const now=Date.now(),dt=liveBubble.at?Math.max(1,now-liveBubble.at):0;if(dt){liveBubble.down=Math.max(0,Math.round((bytes.rx-liveBubble.rx)*1000/dt/1024));liveBubble.up=Math.max(0,Math.round((bytes.tx-liveBubble.tx)*1000/dt/1024))}liveBubble.rx=bytes.rx;liveBubble.tx=bytes.tx;liveBubble.at=now}}catch(_){}try{liveBubble.timerEnd=NAT().getPetTimerEnd?.()||liveBubble.timerEnd;liveBubble.alarmAt=NAT().getNextAlarmTime?.()||0;liveBubble.dndFilter=NAT().getDndFilter?.()??-1}catch(_){}renderOverlayMediaBubble()}
if(MODE==='overlay'){pollOverlayBubbleData();setInterval(pollOverlayBubbleData,5000);setInterval(renderOverlayMediaBubble,1000)}
addEventListener('poring-notification',event=>{if(MODE!=='overlay')return;const n=event.detail||{};liveBubble.notice=[n.title,n.subtitle].filter(Boolean).join(' · ').slice(0,100);liveBubble.noticeUntil=Date.now()+8000;renderOverlayMediaBubble()});

function showNetwork(kind){const wifi=kind==='wifi',data=wifi?NET.wifi:NET.bluetooth,title=wifi?'Wi-Fi networks':'Bluetooth devices';
  const connected=wifi?(data.connected&&data.ssid?[{name:data.ssid,signal:data.signal,connected:true}]:[]):(data.connected||[]).map(name=>({name,connected:true}));
  const available=wifi?(data.available||[]):(data.available||[]).map(name=>typeof name==='string'?{name}:name);
  const list=[...connected,...available],networkRows=list.map(item=>'<div class="net-row"><b>'+esc(item.name)+'</b><small>'+(item.connected?'Connected':wifi&&item.signal!=null?item.signal+'%':'')+'</small></div>').join('');
  isl.dataset.info='on';sel='net:'+kind;info.innerHTML=bare(title)+'<div class="net-list">'+(networkRows||'<div class="empty">'+(wifi?'No Wi-Fi networks found.':'No Bluetooth devices found.')+'</div>')+'</div><div class="net-actions"><button id="open-net-settings">Open '+(wifi?'Wi-Fi':'Bluetooth')+' settings</button><button id="refresh-net">Refresh</button></div>';
  $('#open-net-settings').onclick=ev=>{ev.stopPropagation();NAT().openNetworkSettings&&NAT().openNetworkSettings(kind)};
  $('#refresh-net').onclick=ev=>{ev.stopPropagation();pollNet().then(()=>showNetwork(kind))}}
if(MODE==='desktop')try{NAT().onPlatform&&NAT().onPlatform(p=>{if(p.wifi)Object.assign(NET.wifi,p.wifi);if(p.bluetooth)Object.assign(NET.bluetooth,p.bluetooth);renderNet();if(sel==='net:wifi'||sel==='net:bluetooth')showNetwork(sel.slice(4))})}catch(_){}
$('#nw').onclick=e=>{e.stopPropagation();showNetwork('wifi')};
$('#nb').onclick=e=>{e.stopPropagation();showNetwork('bluetooth')};
addEventListener('online',pollNet);addEventListener('offline',pollNet);setInterval(pollNet,10000);pollNet();

/* ---- settings (inside the expanded panel) ---- */
let nativeLook={};try{nativeLook=JSON.parse(NAT().getPetLook?.()||'{}')}catch(_){}
const SET=Object.assign({pk:100,cw:100,ch:100,theme:'liquid',col:'0',mat:0,acc:'glasses',hat:'',custom:''},LS.get('poring-capsule-settings')||{},nativeLook);
const saveSet=()=>{LS.set('poring-capsule-settings',SET);NAT().savePetLook?.(SET.pk,SET.acc,SET.hat)};
let ntT=0;const nt=()=>{isl.classList.add('nt');clearTimeout(ntT);ntT=setTimeout(()=>isl.classList.remove('nt'),250)};
function applySize(){petScale=SET.pk/100;isl.style.setProperty('--pk',petScale);isl.style.setProperty('--cw',SET.cw/100);isl.style.setProperty('--ch',SET.ch/100);requestAnimationFrame(()=>window.syncCapsuleBounds&&window.syncCapsuleBounds())}
window.syncCapsuleBounds=()=>{if(MODE==='desktop'||!NAT().resizeCapsule)return;const expanded=isl.dataset.view==='exp',w=MODE==='overlay'?(expanded?360:144+82*SET.pk/100):(expanded?600:290)*SET.cw/100+24,h=MODE==='overlay'?(expanded?460:Math.max(120,82*SET.pk/100+16)):(expanded?(isl.dataset.info==='on'?548:330)*SET.ch/100+30:56*SET.ch/100+30);NAT().resizeCapsule(w,h)};
new MutationObserver(()=>requestAnimationFrame(window.syncCapsuleBounds)).observe(isl,{attributes:true,attributeFilter:['data-view','data-info']});
function setPetSize(v){SET.pk=cl(+v,40,240);nt();applySize();saveSet()}
function setCapsuleWidth(v){SET.cw=cl(+v,70,140);nt();applySize();saveSet()}
function setCapsuleHeight(v){SET.ch=cl(+v,70,140);nt();applySize();saveSet()}
if(MODE==='overlay')setInterval(()=>{try{const remote=JSON.parse(NAT().getPetLook?.()||'{}');if((+remote.pk&&+remote.pk!==SET.pk)||remote.acc!==undefined&&remote.acc!==SET.acc||remote.hat!==undefined&&remote.hat!==SET.hat){if(+remote.pk)SET.pk=cl(+remote.pk,40,240);if(remote.acc!==undefined)SET.acc=remote.acc;if(remote.hat!==undefined)SET.hat=remote.hat;accSel=SET.acc;hatSel=SET.hat;applySize()}}catch(_){}},1000);
const mark=(btn,attr)=>$$('.st ['+attr+']').forEach(b=>b.classList.toggle('on',b===btn));
function showSettings(){isl.dataset.info='on';sel='';renderStrip();
  const th=[['Liquid glass','liquid'],['Black','black'],['Transparent','clear']];
  info.innerHTML=bare('Settings')+`<div class="st">
   <div class="sr"><span>Pet size</span><div class="pet-size-control"><input type="range" id="s_pk" min="40" max="240" value="${SET.pk}" aria-label="Pet size"><em id="s_pkv">${SET.pk}%</em></div><button class="confirm-size" id="confirm-pet-size">Confirm</button></div>
   <div class="sr"><span>Capsule width</span><button data-size="cw:-5" aria-label="Narrower capsule">−</button><em id="s_cwv">${SET.cw}%</em><button data-size="cw:5" aria-label="Wider capsule">+</button></div>
   <div class="sr"><span>Capsule height</span><button data-size="ch:-5" aria-label="Shorter capsule">−</button><em id="s_chv">${SET.ch}%</em><button data-size="ch:5" aria-label="Taller capsule">+</button></div>
   <div class="sr"><span>Theme</span>${th.map(([l,k])=>`<button data-th="${k}" class="${SET.theme===k?'on':''}">${l}</button>`).join('')}</div>
   <div class="sr"><span>Colour</span>${VAR.map((v,i)=>`<button data-col="${i}" class="${!useCustomCol&&cId===i?'on':''}"><i class="sw" style="background:${dotc(v[1])}"></i>${esc(v[0])}</button>`).join('')}<input type="color" id="s_cc" value="${SET.custom||'#ff5c80'}" title="Custom colour"></div>
   <div class="sr"><span>Material</span><button data-mat="0" class="${!glassMode?'on':''}">Solid</button><button data-mat="1" class="${glassMode?'on':''}">Glass</button></div>
   <div class="sr"><span>Pet behavior</span><button data-behavior="default" class="${behavior==='default'?'on':''}">Default · Follow</button><button data-behavior="random" class="${behavior==='random'?'on':''}">Random</button></div>
   <div class="sr"><span>Gear</span><select id="s_gear">${GEAR.map(([l,k])=>`<option value="${k}"${accSel===k?' selected':''}>${esc(l)}</option>`).join('')}</select><span style="width:auto">Hat</span><select id="s_hat">${HATS.map(([l,k])=>`<option value="${k}"${hatSel===k?' selected':''}>${esc(l)}</option>`).join('')}</select></div>
   <div class="sr"><span>Hotkey</span><small style="opacity:.75">Ctrl + Alt hides / shows the capsule and pet</small></div>
  </div>`;
  $('#s_pk').oninput=e=>{$('#s_pkv').textContent=e.target.value+'%'};
  $('#confirm-pet-size').onclick=e=>{e.stopPropagation();setPetSize($('#s_pk').value);closeInfo()};
  $('#s_cc').oninput=e=>{applyCustom(e.target.value);SET.col='c';SET.custom=e.target.value;saveSet();$$('.st [data-col]').forEach(b=>b.classList.remove('on'))};
  $('#s_gear').onchange=e=>{accSel=e.target.value;SET.acc=accSel;saveSet()};
  $('#s_hat').onchange=e=>{hatSel=e.target.value;SET.hat=hatSel;saveSet()};
  $('.st').addEventListener('click',e=>{const sz=e.target.closest('[data-size]'),t=e.target.closest('[data-th]'),c=e.target.closest('[data-col]'),m=e.target.closest('[data-mat]'),bh=e.target.closest('[data-behavior]');
    if(sz){const[k,step]=sz.dataset.size.split(':'),v=SET[k]+Number(step),fn={cw:setCapsuleWidth,ch:setCapsuleHeight}[k];fn(v);$('#s_'+({cw:'cwv',ch:'chv'}[k])).textContent=SET[k]+'%'}
    else if(t){document.body.dataset.theme=SET.theme=t.dataset.th;saveSet();mark(t,'data-th')}
    else if(c){colorButtons[+c.dataset.col].click();SET.col=c.dataset.col;SET.custom='';saveSet();mark(c,'data-col')}
    else if(m){toggleGlass(+m.dataset.mat);SET.mat=+m.dataset.mat;saveSet();mark(m,'data-mat')}
    else if(bh){behavior=bh.dataset.behavior;LS.set('poring-capsule-behavior',behavior);$$('.st [data-behavior]').forEach(b=>b.classList.toggle('on',b===bh));if(behavior==='default'&&st.inside)start('Follow',1)}})}
$('#sg').onclick=e=>{e.stopPropagation();if(isl.dataset.info==='on'&&info.querySelector('.st'))closeInfo();else showSettings()};

/* ---- keys ---- */
addEventListener('keydown',e=>{
  if(e.ctrlKey&&e.altKey&&e.code==='KeyP'){e.preventDefault();toggleHide();return}
  if(e.key==='Escape'&&!$('#rm').classList.contains('show')){if(isl.dataset.info==='on')closeInfo();else if(isl.dataset.view==='exp')view('idle')}
  if(e.shiftKey&&e.key==='D'&&!/INPUT|SELECT|TEXTAREA/.test((e.target.tagName||'')))document.body.classList.toggle('dev')});

/* ---- host API ---- */
const rcast=new V.Raycaster();
function hitTest(x,y){rcast.setFromCamera(new V.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),cam);return rcast.intersectObject(body).length>0}
function setPetVisible(v){st.hide=!v;if(v){px=0;pz=0;manualY=3;start('ParachuteDrop',1)}}
const ignore=b=>{try{NAT().setIgnoreMouse&&NAT().setIgnoreMouse(b)}catch(_){}};
/* click-through: the page tells the host when the cursor is over something clickable */
if(MODE==='desktop')addEventListener('mousemove',e=>ignore(!(isDragging||$('#rm').classList.contains('show')||(!st.hide&&!st.off&&hitTest(e.clientX,e.clientY)))),true);
else if(window.IslandNative){addEventListener('mousemove',e=>ignore(!(e.target&&e.target.closest&&e.target.closest('#isl,#size-pop,#rm,#sub'))),true);document.addEventListener('mouseleave',()=>ignore(true))}
window.IslandApp={hitTest,setPetVisible,mode:MODE,toggle:toggleHide,setHidden,expand:()=>view('exp'),collapse:()=>view('idle'),setPetOut:setOut,setPetSize,setCapsuleWidth,setCapsuleHeight};

/* ---- start-up: restore settings, pet starts inside the capsule ---- */
applySize();document.body.dataset.theme=SET.theme;
if(SET.col==='c'&&SET.custom)applyCustom(SET.custom);else colorButtons[+SET.col||0].click();
toggleGlass(SET.mat?1:0);accSel=SET.acc;hatSel=SET.hat;
if(MODE==='desktop'){document.body.classList.add('desktop','native');st.inside=false;st.hide=false;autoC.checked=true;start('Idle')}
else{st.inside=true;st.hide=MODE!=='overlay';isl.classList.add('in');document.body.classList.add('inside');autoC.checked=false;start('LookLoop',1)}
renderB();sync();sync2();window.PORING_READY=true;
})();
</script>
</body>
